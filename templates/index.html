{% extends "base.html" %}
{% block content %}
<div class="card p-3 mb-4">
  <form class="row g-2" method="get">
    <div class="col-md-10"><input name="q" value="{{q}}" class="form-control" placeholder="Search Name, Tencent ID..."></div>
    <div class="col-md-2 d-grid"><button class="btn btn-dark">Search</button></div>
  </form>
</div>
<div class="card p-0 overflow-hidden">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr><th>ID</th><th>Name</th><th>Tencent</th><th>Phone</th><th>Headset</th><th>Date Hired</th><th>Contact</th><th>Action</th></tr>
      </thead>
      <tbody>
      {% for a in agents %}
        <tr>
          <td><span class="badge bg-secondary">{{a["id"]}}</span></td>
          <td><strong>{{a["NAME"]}}</strong><br><small>{{a["NBS ID"]}}</small></td>
          <td>{{a["TENCENT ID"]}}</td>
          <td>{{a["PHONE NAME"]}}</td>
          <td>{{a["HEADSET SN"]}}</td>
          <td>{{a["DATE HIRED"]}}</td>
          <td>{{a["CONTACT NO."]}}</td>
          <td><a href="/edit/{{a['id']}}" class="btn btn-sm btn-outline-primary">Edit</a></td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
